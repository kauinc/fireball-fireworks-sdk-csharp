name: Publish to NuGet

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'   # Triggers on tags like v1.2.3

jobs:
  publish:
    name: Build and Publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write  # Required for OIDC token issuance (Trusted Publishing)

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # Strip the leading 'v' from the tag (e.g. v1.2.3 → 1.2.3)
      - name: Extract version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Restore dependencies
        run: dotnet restore Fireball.Fireworks.sln

      - name: Build
        run: >
          dotnet build Fireball.Fireworks.sln
          --configuration Release
          --no-restore
          /p:Version=${{ steps.version.outputs.VERSION }}

      - name: Pack
        run: >
          dotnet pack Fireball.Fireworks.csproj
          --configuration Release
          --no-build
          --output ./nupkg
          /p:Version=${{ steps.version.outputs.VERSION }}

      # Exchange the GitHub OIDC token for a short-lived NuGet API key
      - name: Authenticate with NuGet (Trusted Publishing)
        uses: nuget/login@v1
        id: nuget-login
        with:
          user: ${{ secrets.NUGET_USERNAME }}  # Your nuget.org profile name (not email)

      - name: Push to NuGet.org
        run: >
          dotnet nuget push ./nupkg/Fireball.Fireworks.${{ steps.version.outputs.VERSION }}.nupkg
          --api-key ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
          --source https://api.nuget.org/v3/index.json
          --skip-duplicate
